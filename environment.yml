# conda environment of the study (the versions with which all results were made)
# Create:  conda env create -f environment.yml && conda activate mace-rmd17
# ORCA is installed separately (free for academic use): https://www.faccts.de/orca/
name: mace-rmd17
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4
  - matplotlib=3.10
  - jupyterlab=4.5
  - ipykernel=7.2
  - pip
  - pip:
      - torch==2.11.0
      - mace-torch==0.3.16
      - e3nn==0.4.4
      - ase==3.29.0
      - nglview==4.0.1
      - ipywidgets==8.1.8
      - pillow==12.2.0
